# Default values for mcp-shield Helm chart.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: rahulxcodex/mcp-shield
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Deployment Topology: 'gateway' (centralized proxy service) or 'sidecar'
deploymentMode: gateway

# Enforcement Lifecycle: 'observe' (shadow/audit mode) or 'enforce' (strict fail-closed)
enforcementMode: enforce

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3333"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3333
  targetPort: 3333

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mcp-shield.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowExternalEgress: false

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  labels: {}

nodeSelector: {}
tolerations: []
affinity: {}

# MCP Shield Configuration
config:
  logLevel: info
  telemetryEnabled: true
  redaction:
    enabled: true
    maskStyle: token
    highEntropyCheck: true
    entropyThreshold: 4.5
  sandbox:
    cowEnabled: true
    cowStagingDir: /tmp/mcp-shield/cow
    autoCommitOnApproval: true
    readOnlyWorkspace: false
  egress:
    enabled: true
    allowMode: allow
    allowPrivateNetworks: false
    blockLoopback: true
    blockLinkLocal: true
    blockMetadataEndpoints: true
    blockedDomains:
      - "*.ngrok.io"
      - "*.evil.com"
  audit:
    enabled: true
    logDir: /tmp/mcp-shield/logs
    tamperEvidentHashing: true
