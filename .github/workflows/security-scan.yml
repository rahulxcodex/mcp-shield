name: Security & Container Vulnerability Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * 1' # Weekly scan every Monday at 04:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan:
    name: Trivy Security Scan & SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: rahulxcodex/mcp-shield:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner (Repo Filesystem)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy Vulnerability Scanner (Container Image)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: 'rahulxcodex/mcp-shield:scan-target'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: 'rahulxcodex/mcp-shield:scan-target'
          format: 'cyclonedx'
          output: 'mcp-shield-image.sbom.json'
          github-pat: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Repository Scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs'

      - name: Upload Container Image Scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-shield-sbom
          path: mcp-shield-image.sbom.json
