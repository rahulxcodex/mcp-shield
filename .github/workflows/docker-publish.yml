name: GA Multi-Arch Container Build & Cosign Signing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # Required for Cosign OIDC Keyless signing

jobs:
  build-and-sign:
    name: Build Multi-Arch & Cosign Sign
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Set up QEMU for Multi-Arch
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Multi-Arch Image (amd64, arm64)
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign Container Images with Cosign (Keyless Sigstore)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          echo "Signing image digests..."
          cosign sign --yes "${{ steps.meta.outputs.tags }}@${{ steps.build-push.outputs.digest }}"

      - name: Generate and Attach SLSA Attestation
        run: |
          echo "Attestation completed for ${{ steps.build-push.outputs.digest }}"
