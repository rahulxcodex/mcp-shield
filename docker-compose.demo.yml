version: '3.8'

services:
  # MCP Shield - Zero-Trust Security Gateway
  mcp-shield:
    build:
      context: .
      dockerfile: Dockerfile
    image: rahulxcodex/mcp-shield:latest
    container_name: mcp-shield-demo-gateway
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'
    volumes:
      - ./shield.config.default.yaml:/app/shield.config.default.yaml:ro
      - mcp-shield-demo-logs:/app/.mcp-shield/logs
      - mcp-shield-demo-cow:/app/.mcp-shield/cow
    ports:
      - "3333:3333" # Dashboard & Telemetry port
    environment:
      - NODE_ENV=production
      - ENFORCEMENT_MODE=enforce # Options: 'observe' (shadow mode) or 'enforce' (fail-closed)
      - MCP_SHIELD_DASHBOARD_PORT=3333
      - MCP_SHIELD_LOG_LEVEL=info
      - MCP_SHIELD_TELEMETRY_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://localhost:3333/healthz', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mcp-shield-net

  # Mock Vulnerable Upstream MCP Tool Server for Live Exploit Demos
  mock-mcp-server:
    image: node:20-alpine
    container_name: mock-vulnerable-mcp-server
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["node", "-e"]
    command:
      - |
        const http = require('http');
        const server = http.createServer((req, res) => {
          let body = '';
          req.on('data', chunk => { body += chunk; });
          req.on('end', () => {
            res.writeHead(200, { 'Content-Type': 'application/json' });
            res.end(JSON.stringify({
              status: 'executed',
              message: 'Upstream MCP Server executed tool request.',
              received: body ? JSON.parse(body) : null,
              timestamp: new Date().toISOString()
            }));
          });
        });
        server.listen(8080, () => console.log('Mock MCP Server listening on port 8080'));
    ports:
      - "8080:8080"
    networks:
      - mcp-shield-net

networks:
  mcp-shield-net:
    driver: bridge

volumes:
  mcp-shield-demo-logs:
  mcp-shield-demo-cow:
