version: '3.8'

services:
  mcp-shield:
    build:
      context: .
      dockerfile: Dockerfile
    image: rahulxcodex/mcp-shield:latest
    container_name: mcp-shield-gateway
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    volumes:
      - ./shield.config.default.yaml:/app/shield.config.default.yaml:ro
      - mcp-shield-logs:/app/.mcp-shield/logs
      - mcp-shield-cow:/app/.mcp-shield/cow
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - MCP_SHIELD_DASHBOARD_PORT=3333

volumes:
  mcp-shield-logs:
  mcp-shield-cow:
