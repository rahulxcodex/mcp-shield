version: "1.0"
profile: default
mode: enforce # Options: 'enforce' (active blocking), 'audit' (shadow dry-run), 'warn' (alert only)
onError: block # Fail-closed invariant on internal exceptions: 'block' or 'bypass'

compliance:
  preset: enterprise-standard # Options: 'enterprise-standard', 'hipaa-strict', 'gdpr-strict'
  redactPii: true # GDPR Article 25 Privacy by Design
  redactPhi: true # HIPAA § 164.312 Safe Harbor 18 Identifiers
  zeroDataRetention: false # When true, drops payload bodies from memory post-evaluation
  auditRetentionDays: 365 # SOC 2 CC7.2 compliance requirement

redaction:
  enabled: true
  maskStyle: token
  highEntropyCheck: true
  entropyThreshold: 4.5

sandbox:
  cowEnabled: true
  cowStagingDir: .mcp-shield/cow
  autoCommitOnApproval: true
  readOnlyWorkspace: false

egress:
  enabled: true
  allowMode: allow
  allowPrivateNetworks: false
  blockLoopback: true
  blockLinkLocal: true
  blockMetadataEndpoints: true
  blockedDomains:
    - "*.ngrok.io"
    - "*.evil.com"
    - "*evil-c2-server.com*"

audit:
  enabled: true
  logDir: .mcp-shield/logs
  tamperEvidentHashing: true

rules:
  - id: "allow-all-safe"
    name: "Allow safe commands"
    priority: 10
    riskLevel: "LOW"
    action: "allow"
    
  - id: "block-destructive-rm"
    name: "Block Recursive Root Deletion"
    priority: 100
    targetTools:
      - "*bash*"
      - "*terminal*"
      - "*exec*"
    riskLevel: "CRITICAL"
    action: "block"
