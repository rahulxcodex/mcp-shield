version: "1.0"
profile: default

redaction:
  enabled: true
  maskStyle: token
  highEntropyCheck: true
  entropyThreshold: 4.5

sandbox:
  cowEnabled: true
  cowStagingDir: .mcp-shield/cow
  autoCommitOnApproval: true
  readOnlyWorkspace: false

egress:
  enabled: true
  allowMode: allow
  allowPrivateNetworks: false
  blockLoopback: true
  blockLinkLocal: true
  blockMetadataEndpoints: true
  blockedDomains:
    - "*.ngrok.io"
    - "*.evil.com"

audit:
  enabled: true
  logDir: .mcp-shield/logs
  tamperEvidentHashing: true

rules:
  - id: "allow-all-safe"
    name: "Allow safe commands"
    priority: 10
    riskLevel: "LOW"
    action: "allow"
    
  - id: "block-destructive-rm"
    name: "Block Recursive Root Deletion"
    priority: 100
    targetTools:
      - "*bash*"
      - "*terminal*"
      - "*exec*"
    riskLevel: "CRITICAL"
    action: "block"
